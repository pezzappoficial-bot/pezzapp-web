<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #plano { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; }
  #plano svg { height: 70%; }
</style>
</head>
<body>
<div id="plano"><svg viewBox="0 0 264 196" aria-hidden="true"><g transform="translate(2 2)">
  <path d="M86.4 83.2 L32 56 Q11.2 43.2 14.4 62.4 Q28.8 96 14.4 129.6 Q11.2 148.8 32 136 L86.4 108.8 Z" fill="#FFD23F" stroke="#FFD23F" stroke-width="8" stroke-linejoin="round"/>
  <g stroke="#E9B814" stroke-width="2.5" stroke-linecap="round" fill="none"><path d="M72 90 L26 66"/><path d="M72 94 L22 86"/><path d="M72 98 L22 106"/><path d="M72 102 L26 126"/></g>
  <path d="M60 22.4 Q61.6 4.8 81.6 10.4 Q168 16 222.4 75.2 Q232 96 222.4 116.8 Q168 176 81.6 181.6 Q61.6 187.2 60 169.6 Q75.2 140 83.2 112 Q86.4 96 83.2 80 Q75.2 52 60 22.4 Z" fill="#29B6CC" stroke="#29B6CC" stroke-width="12" stroke-linejoin="round"/>
  <path d="M91 40 Q93 70 91 96 Q89 124 91 152 L108 152 Q112 138 106 124 Q101 110 109 96 Q114 82 106 68 Q101 54 109 40 Z" fill="#FFD23F"/>
  <path d="M131 51 Q133 74 131 96 Q129 118 131 141 L148 141 Q152 130 146 119 Q141 108 149 96 Q154 84 146 73 Q141 62 149 51 Z" fill="#FFD23F"/>
  <circle cx="184" cy="90" r="14" fill="#FFFFFF"/><circle cx="188" cy="91" r="7.5" fill="#0E3A5B"/><circle cx="191" cy="87" r="2.6" fill="#FFFFFF"/>
  <ellipse cx="232" cy="96" rx="22" ry="16.5" fill="#FFD23F"/><path d="M238 96 L254 96" stroke="#E9B814" stroke-width="3" stroke-linecap="round"/>
</g></svg></div>
<script src="three.min.js"></script>
<script>
(() => {
  // Si el móvil no tiene WebGL, enseñamos el pez plano.
  function plano() { document.getElementById('plano').style.display = 'flex'; window.celebrar = () => {}; }
  if (!window.THREE) { plano(); return; }
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); } catch (e) { plano(); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(0x000000, 0);
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
  camera.position.set(0, 0.2, 7.2);
  scene.add(new THREE.HemisphereLight(0xdff6ff, 0x0b2a40, 0.95));
  const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(3, 4, 5); scene.add(key);
  const rim = new THREE.DirectionalLight(0x9fe8ff, 0.6); rim.position.set(-4, 1, -3); scene.add(rim);
  const turq = new THREE.MeshStandardMaterial({ color: 0x29B6CC, roughness: 0.55 });
  const yellow = new THREE.MeshStandardMaterial({ color: 0xFFD23F, roughness: 0.5 });
  const yellowDark = new THREE.MeshStandardMaterial({ color: 0xE9B814, roughness: 0.6 });
  [turq, yellow, yellowDark].forEach(m => m.color.convertSRGBToLinear());
  const fish = new THREE.Group();

  const body = new THREE.Shape();
  body.moveTo(-0.95, 0.92);
  body.quadraticCurveTo(-0.93, 1.14, -0.68, 1.07);
  body.quadraticCurveTo(0.4, 1.0, 1.08, 0.26);
  body.quadraticCurveTo(1.2, 0, 1.08, -0.26);
  body.quadraticCurveTo(0.4, -1.0, -0.68, -1.07);
  body.quadraticCurveTo(-0.93, -1.14, -0.95, -0.92);
  body.quadraticCurveTo(-0.76, -0.55, -0.66, -0.2);
  body.quadraticCurveTo(-0.62, 0, -0.66, 0.2);
  body.quadraticCurveTo(-0.76, 0.55, -0.95, 0.92);
  const depth = 0.34, bt = 0.17;
  const bodyGeo = new THREE.ExtrudeGeometry(body, { depth, bevelEnabled: true, bevelThickness: bt, bevelSize: 0.16, bevelSegments: 10, curveSegments: 40 });
  bodyGeo.translate(0, 0, -depth / 2);
  fish.add(new THREE.Mesh(bodyGeo, turq));
  const face = depth / 2 + bt - 0.02;

  function band(x0, x1, h) {
    const pts = [];
    for (let i = 0; i <= 10; i++) { const y = h - (2 * h * i) / 10; pts.push(new THREE.Vector2(x0 + 0.015 * Math.sin(i), y)); }
    for (let i = 0; i <= 14; i++) { const y = -h + (2 * h * i) / 14; pts.push(new THREE.Vector2(x1 + 0.045 * Math.sin(i * 1.35), y)); }
    const s = new THREE.Shape(); s.moveTo(pts[0].x, pts[0].y); s.splineThru(pts.slice(1)); s.closePath();
    return new THREE.ExtrudeGeometry(s, { depth: 0.03, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 4, curveSegments: 24 });
  }
  [[-0.56, -0.34, 0.7], [-0.06, 0.16, 0.56]].forEach(([a, b, h]) => {
    const g = band(a, b, h);
    const front = new THREE.Mesh(g, yellow); front.position.z = face; fish.add(front);
    const back = new THREE.Mesh(g, yellow); back.position.z = -face; back.scale.z = -1; fish.add(back);
  });
  [1, -1].forEach(side => {
    const white = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.35 });
    const navy = new THREE.MeshStandardMaterial({ color: 0x0E3A5B, roughness: 0.3 });
    navy.color.convertSRGBToLinear();
    const eye = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.05, 40), white);
    eye.rotation.x = Math.PI / 2; eye.position.set(0.6, 0.08, side * (face + 0.02)); fish.add(eye);
    const pupil = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.05, 32), navy);
    pupil.rotation.x = Math.PI / 2; pupil.position.set(0.64, 0.07, side * (face + 0.05)); fish.add(pupil);
    const shine = new THREE.Mesh(new THREE.SphereGeometry(0.03, 16, 12), white);
    shine.position.set(0.67, 0.12, side * (face + 0.08)); fish.add(shine);
  });
  const lips = new THREE.Mesh(new THREE.SphereGeometry(0.24, 40, 24), yellow);
  lips.scale.set(1.15, 0.85, 0.95); lips.position.set(1.2, 0, 0); fish.add(lips);
  const lipLine = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.012, 8, 40, Math.PI), yellowDark);
  lipLine.rotation.y = Math.PI / 2; lipLine.rotation.z = Math.PI / 2; lipLine.position.set(1.43, 0, 0); fish.add(lipLine);
  const tail = new THREE.Shape();
  tail.moveTo(-0.62, 0.16); tail.lineTo(-1.3, 0.5);
  tail.quadraticCurveTo(-1.56, 0.66, -1.52, 0.42);
  tail.quadraticCurveTo(-1.34, 0, -1.52, -0.42);
  tail.quadraticCurveTo(-1.56, -0.66, -1.3, -0.5);
  tail.lineTo(-0.62, -0.16); tail.closePath();
  const tailGeo = new THREE.ExtrudeGeometry(tail, { depth: 0.06, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.06, bevelSegments: 6, curveSegments: 24 });
  tailGeo.translate(0, 0, -0.03);
  fish.add(new THREE.Mesh(tailGeo, yellow));
  [0.42, 0.14, -0.14, -0.42].forEach(y => {
    const rib = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.62, 8), yellowDark);
    rib.rotation.z = Math.PI / 2 + Math.atan2(y, 0.8);
    rib.position.set(-1.12, y * 0.62, 0.075); fish.add(rib);
    const rib2 = rib.clone(); rib2.position.z = -0.075; fish.add(rib2);
  });
  fish.rotation.x = 0.08;
  scene.add(fish);

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  let dragY = 0, dragging = false, lastX = 0, spin = null;
  document.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; });
  document.addEventListener('pointermove', e => { if (!dragging) return; dragY += (e.clientX - lastX) * 0.012; lastX = e.clientX; });
  document.addEventListener('pointerup', () => { dragging = false; });
  document.addEventListener('pointercancel', () => { dragging = false; });

  const easeOut = t => 1 - Math.pow(1 - t, 3);
  function frame(now) {
    const t = now / 1000;
    let extraY = 0, jump = 0;
    if (spin) {
      if (spin.start === null) spin.start = now;
      const p = Math.min(1, (now - spin.start) / spin.dur);
      extraY = easeOut(p) * Math.PI * 2;
      jump = Math.sin(p * Math.PI) * 0.45;
      if (p >= 1) { spin = null; dragY += Math.PI * 2; extraY = 0; }
    }
    fish.rotation.y = Math.sin(t * 0.9) * 0.35 + dragY + extraY;
    fish.position.y = Math.sin(t * 1.6) * 0.06 + jump;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // La app llama a celebrar() cuando marcas un aviso como hecho.
  window.celebrar = () => { spin = { start: null, dur: 1100 }; };
  if (location.search.indexOf('saludo') >= 0) window.celebrar();
})();
</script>
</body>
</html>
